[project]
name = "emporio-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
