[project]
name = "emporio-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.8",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]
